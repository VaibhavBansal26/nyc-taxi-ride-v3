name: taxi_rides_hourly_features_pipeline

on:
  schedule:
    - cron: "2 * * * *" # every hour
  workflow_dispatch:

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipelines.txt
      - run: pip install -r requirements-pipelines.txt
      - name: Fetch new rides and load them into Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python -m src.feature_pipeline
