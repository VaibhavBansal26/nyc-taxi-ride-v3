name: taxi_rides_hourly_inference_pipeline

on:
  workflow_run:
    workflows: ["taxi_rides_hourly_features_pipeline"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: inference-pipeline
  cancel-in-progress: false

jobs:
  predict:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipelines.txt
      - run: pip install -r requirements-pipelines.txt
      - name: Predict next-hour demand and store it
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: python -m pipelines.inference_pipeline
