[project]
name = "nyc-taxi-ride-v3"
version = "3.1.0"
description = "Next-hour NYC yellow-taxi demand forecasting: Hopsworks feature store, LightGBM, Streamlit"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "hopsworks[python]>=4.2,<6",
    "lightgbm>=4.3",
    "scikit-learn==1.5.2",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "streamlit-folium>=0.20",
    "folium>=0.17",
    "branca>=0.7",
    "geopandas>=1.0",
    "plotly>=5.20",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyter",
    "notebook",
    "matplotlib",
    "seaborn",
    "ipywidgets",
    "xgboost",
    "mlflow",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", ".venv", "myenv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
